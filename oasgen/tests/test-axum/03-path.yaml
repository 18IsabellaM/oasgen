openapi: 3.0.3
info:
  title: ''
  version: ''
paths:
  /tasks/{id}/:
    get:
      operationId: get_task
      parameters:
      - name: id
        required: true
        schema:
          type: integer
        in: path
        style: simple
      responses:
        '400':
          description: A path parameter could not be parsed into its expected type.
  /tasks/{id}/{tu}:
    get:
      operationId: get_stuff
      parameters:
      - name: id
        required: true
        schema:
          type: integer
        in: path
        style: simple
      - name: tu
        required: true
        schema:
          type: integer
        in: path
        style: simple
      responses:
        '400':
          description: A path parameter could not be parsed into its expected type.
components:
  schemas:
    TaskFilter:
      description: Send a code to a mobile number
      type: object
      properties:
        completed:
          type: boolean
        assigned_to:
          type: integer
      required:
      - completed
      - assigned_to