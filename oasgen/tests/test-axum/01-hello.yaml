openapi: 3.0.3
info:
  title: ''
  version: ''
paths:
  /hello:
    post:
      operationId: send_code
      tags:
        - auth
      description: Endpoint to login by sending a code to the given mobile number
      summary: A shorter description
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCode'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCodeResponse'
        '400':
          description: The request body could not be parsed as JSON.
        '422':
          description: The request body is valid JSON but does not match the expected schema.
components:
  schemas:
    SendCode:
      type: object
      description: Send a code to a mobile number
      properties:
        mobile:
          description: Mobile phone number
          type: string
      required:
      - mobile
    SendCodeResponse:
      type: object
      properties:
        found_account:
          description: Indicates account found
          type: boolean
      required:
      - found_account